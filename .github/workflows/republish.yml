name: Republish site

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  trigger-deploy:
    name: Trigger Vercel deploy hook
    runs-on: ubuntu-latest
    steps:
      - name: Fire deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi

          status=$(curl --silent --show-error \
            --request POST \
            --output response.json \
            --write-out '%{http_code}' \
            "$DEPLOY_HOOK_URL")

          echo "HTTP $status"
          cat response.json || true
          echo

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Deploy hook rejected the request. If it was revoked, recreate it in Vercel and update the VERCEL_DEPLOY_HOOK_URL secret."
            exit 1
          fi

          echo "Deploy queued."
